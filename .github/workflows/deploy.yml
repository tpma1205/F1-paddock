# 抓取最新資料 → 建置 → 部署到 GitHub Pages。
#
# 三種觸發：
# - push 到 main：程式碼變更即部署
# - 每天一次：練習賽名次表是增量抓的（只補新結束的場次），每天跑的成本與每週
#   跑差不多，但週五排位賽隔天就看得到，而不是等到下週二。分鐘數刻意不訂整點
#   —— 實測 `0 2` 會被 GitHub 的排程佇列延遲五小時（14:58 才跑）。
# - 比賽週末（UTC 週五～週一）每 3 小時一次：週一納入是因為美洲站的正賽在 UTC
#   週一凌晨結束。排程只縮短「不按按鈕也看得到」的等待，不是即時；場次剛結束時
#   使用者仍可在頁面頁尾按「立即更新」（docs/adr/0005）。
# - workflow_dispatch：隨時手動更新
#
# 三條規則（docs/adr/0001、0004）：
# - 抓取失敗沿用既有快照繼續建置，第三方服務的故障不該讓部署紅字
# - 抓到的資料不 commit 回 repo；只有「一季結束的最終狀態」與「新公布的下一季」
#   會被封存 commit 一次（scripts/archive-snapshots.ts 決定）
# - 測試分兩段：抓取「前」對 repo 內的快照跑，失敗＝程式壞了，擋部署；抓取「後」
#   對新資料再跑一次，失敗＝新資料有東西要人工補（典型是新車手缺中文譯名），
#   照常部署（畫面會降級顯示英文），但 data-check job 會讓整個 run 紅字寄信提醒。
#   曾經因為代打車手平川亮缺譯名，讓排程部署連續失敗、網站停在舊資料。

name: Deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'
    - cron: '43 */3 * * 5,6,0,1'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      data-check: ${{ steps.data-check.outcome }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # 對 repo 內 commit 的快照跑：結果只取決於程式碼，失敗就是程式壞了。
      - name: 測試（既有快照）
        run: npm test

      # 抓取腳本本身就會在失敗時沿用既有快照並以 0 退出，這裡不需要 continue-on-error。
      - name: 抓取最新資料
        run: npm run fetch

      - name: 封存已結束的球季（若有）
        run: |
          FILES=$(node scripts/archive-snapshots.ts)
          if [ -z "$FILES" ]; then
            echo "沒有需要封存的快照。"
            exit 0
          fi
          echo "封存：$FILES"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "$FILES" | xargs git add
          git commit -m "封存快照 [skip ci]" -m "由 Deploy workflow 自動 commit：該季已結束，或新一季賽程首次出現。"
          git push

      # 對剛抓到的資料再跑一次。失敗不擋部署，由下方 data-check job 負責紅字提醒。
      - name: 檢查新資料（譯名、國籍等涵蓋率）
        id: data-check
        continue-on-error: true
        run: npm test

      - name: 建置（含型別檢查與路由預產生）
        run: npm run build

      # 把 Pages 來源設為 GitHub Actions（新 repo 預設是「從分支部署」，會把原始碼
      # 直接發布出去）。enablement: true 讓第一次執行就自動啟用，不需手動進設定頁。
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # 新資料檢查失敗時，網站已照常部署；這個 job 只負責讓 run 紅字、寄通知信。
  # 修法通常是在 src/data/localisation.ts 補上新車手／車隊／賽道的中文名。
  data-check:
    needs: [build, deploy]
    if: needs.build.outputs.data-check == 'failure'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "::error::新抓到的資料沒通過涵蓋率測試（網站已照常部署）。請到 build job 的「檢查新資料」步驟看缺了什麼，通常是 src/data/localisation.ts 要補新車手的中文名。"
          exit 1
